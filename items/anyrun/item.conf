# Things to do to install the item
function install() {
    items=$(bash -c "ls $rootdir/items/anyrun/src")
    run mkdir -p ~/.config/anyrun
    for item in $items; do
        run ln -sfn $rootdir/items/anyrun/src/$item ~/.config/anyrun/$item
    done
}

# Check if the item is installed, return true if installed
function check() {
    [[ -d ~/.config/anyrun ]] && return 1
    return 0
}

