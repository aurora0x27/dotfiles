#!/usr/bin/env bash

# Check the dependency return true if installed dependency
function check_dep() {
    command -v tmux >/dev/null 2>&1 || return 1
    command -v tpack >/dev/null 2>&1 || return 1
    return 0
}

# Things to do to install the dependency
function install_dep() {
    case "$sys_id" in
        "hydrogen")
            run paru -S tmux tpack
            return $(( $? ))
            ;;
        "helium")
            run brew install tmux tpack
            return $(( $? ))
            ;;
        "lithium")
            run apt install tmux
            run curl -O https://github.com/tmuxpack/tpack/releases/download/v0.5/tpack_0.5_linux_amd64.deb -o /tmp/tpack.deb
            run sudo dpkg -i /tmp/tpack.deb
            return $(( $? ))
            ;;
        *)
            log_error "No default installation method is set"
            return 1
            ;;
    esac
}

# Things to do to install the item
function install() {
    run mkdir -p ~/.config/tmux/plugins
    run ln -sf "$item_dir/src/tmux.conf" ~/.config/tmux/tmux.conf
    if [[ ! -f "$item_dir/local/$sys_id.conf" ]]; then
        run touch "$item_dir/local/$sys_id.conf"
    fi
    run ln -sf "$item_dir/local/$sys_id.conf" ~/.config/tmux/local.conf
    log_hint "Please run 'tpack tui' to check plugins"
}

# Check if the item is installed, return true if installed
function check() {
    [[ -d ~/.config/tmux ]] && return 0
    return 1
}

# Things to do to uninstall the item
function uninstall() {
    run unlink ~/.config/tmux
}
