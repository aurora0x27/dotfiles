#!/usr/bin/env bash

# Check the dependency return true if installed dependency
function check_dep() {
    command -v swaync >/dev/null 2>&1 && return 0
    return 1
}

# Things to do to install the dependency
function install_dep() {
    run paru -S swaync
}

# Things to do to install the item
function install() {
    run mkdir -p $HOME/.config/swaync
    run ln -sfn $rootdir/items/swaync/src/style.css $HOME/.config/swaync/style.css
    run ln -sfn $rootdir/items/swaync/src/config.json $HOME/.config/swaync/config.json
}

# Check if the item is installed, return true if installed
function check() {
    [[ -d $HOME/.config/swaync ]] && return 0
    return 1
}

# Things to do to uninstall the item
function uninstall() {
    run rm -rf $HOME/.config/swaync
}
