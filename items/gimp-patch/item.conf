#!/usr/bin/env bash

# Check the dependency return true if installed dependency
function check_dep() {
    command -v gimp >/dev/null 2>&1 && return 1
    return 0
}

# Things to do to install the dependency
function install_dep() {
    run paru -S gimp
}

# Things to do to install the item
function install() {
    run ln -sfn $rootdir/items/gimp-patch/src/gimp.desktop $HOME/.local/share/applications/gimp.desktop
}

# Check if the item is installed, return true if installed
function check() {
    [[ -f $HOME/.local/share/applications/gimp.desktop ]] && return 1
    return 0
}

# Things to do to uninstall the item
function uninstall() {
    run rm $HOME/.local/share/applications/gimp.desktop
}
