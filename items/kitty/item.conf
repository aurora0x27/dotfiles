#!/usr/bin/env bash

# Check the dependency return true if installed dependency
function check_dep() {
    if [[ $(uname) == "Darwin" ]]; then
        mdfind "kMDItemFSName == '*.app'" | grep kitty 2>/dev/null 1>&2
        return $(( $? ))
    elif [[ $(uname) == "Linux" ]]; then
        command -v kitty >/dev/null 2>&1 && return 0
        return 1
    else
        log_error "Unsupported system"
        return 0
    fi
}

# Things to do to install the dependency
function install_dep() {
    if [[ $sys_id == "hydrogen" ]]; then
        run paru -S kitty
        return $(( $? ))
    elif [[ $sys_id == "helium" ]]; then
        run brew install kitty
        return $(( $? ))
    else
        log_error "No default installation method is set"
        return 1
    fi
}

# Things to do to install the item
function install() {
    if [[ "$sys_id" == 'lithium' ]] then
        log_error "$target is not avaliable on headless machine"
        return 1
    fi
    run mkdir -p ~/.config/kitty
    run ln -sf $rootdir/items/kitty/src/current-theme.conf ~/.config/kitty/current-theme.conf
    case "$sys_id" in
        "hydrogen")
            if ! command -v fish >/dev/null 2>&1; then
                log_error "Cannot install kitty config without fish binary installed"
                return 1
            fi
            log_hint "Gnerating config file..."
            run "awk -f $rootdir/utils/replace.awk $rootdir/items/kitty/local/$sys_id.awk $rootdir/items/kitty/src/kitty.conf.tmpl | tee ~/.config/kitty/kitty.conf"
            return $(( $? ))
            ;;
        "helium")
            if ! command -v zsh >/dev/null 2>&1; then
                log_error "Cannot install kitty config without zsh binary installed"
                return 1
            fi
            log_hint "Gnerating config file..."
            run "gawk -f $rootdir/utils/replace.awk $rootdir/items/kitty/local/$sys_id.awk $rootdir/items/kitty/src/kitty.conf.tmpl | tee ~/.config/kitty/kitty.conf"
            return $(( $? ))
            ;;
        *)
            log_error "Haven't assigned a localized file"
            return 1
            ;;
    esac
}

# Check if the item is installed, return true if installed
function check() {
    [[ -d ~/.config/kitty ]] && return 0
    return 1
}

# Things to do to uninstall the item
function uninstall() {
    run rm -rf ~/.config/kitty
}
