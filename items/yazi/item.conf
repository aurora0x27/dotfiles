#!/usr/bin/env bash

# Check the dependency return true if installed dependency
function check_dep() {
    command -v yazi >/dev/null 2>&1 && return 0
    return 1
}

# Things to do to install the dependency
function install_dep() {
    if [[ $sys_id == "archlinux" ]]; then
        run paru -S yazi
    elif [[ $sys_id == "macmini" ]]; then
        run brew install yazi
    else
        log_error "No default installation method is set"
        return 1
    fi
}

# Things to do to install the item
function install() {
    run mkdir -p ~/.config/yazi
    items=$(bash -c "ls $rootdir/items/yazi/src")
    for item in $items; do
        run ln -sfn $rootdir/items/yazi/src/$item ~/.config/yazi/$item
    done
    scripts=$(bash -c "ls $rootdir/items/yazi/src/scripts")
    for script in $scripts; do
        run ln -sfn $rootdir/items/yazi/src/scripts/$script ~/.local/bin/$script
    done
    log_hint "please run 'ln -sf ~/.config/yazi/themes/<theme>.toml ~/.config/yazi/theme.toml' to choose a theme"
}

# Check if the item is installed, return true if installed
function check() {
    [[ -d ~/.config/yazi ]] && return 0
    return 1
}

# Things to do to uninstall the item
function uninstall() {
    run rm -rf ~/.config/yazi
    scripts=$(bash -c "ls $rootdir/items/yazi/src/scripts")
    for script in $scripts; do
        run rm -rf $rootdir/items/yazi/src/scripts/$script ~/.local/bin/$script
    done
}
