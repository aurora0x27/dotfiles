#!/usr/bin/env bash

# Check the dependency return false if installed dependency
function check_dep() {
    command -v foot >/dev/null 2>&1 && return 0
    return 1
}

# Things to do to install the dependency
function install_dep() {
    if [[ $sys_id == "hydrogen" ]]; then
        run paru -S foot
    elif [[ $sys_id == "helium" ]]; then
        run brew install foot
    else
        log_error "No default installation method is set"
        return 1
    fi
}

# Things to do to install the item
function install() {
    run mkdir -p $HOME/.config/foot
    case "$sys_id" in
        "hydrogen")
            log_hint "Gnerating config file..."
            run "awk -f $rootdir/utils/replace.awk $rootdir/items/foot/src/local/$sys_id.awk $rootdir/items/foot/src/foot.ini.tmpl | tee ~/.config/foot/foot.ini"
            return $(( $? ))
            ;;
        "helium")
            log_hint "Gnerating config file..."
            run "gawk -f $rootdir/utils/replace.awk $rootdir/items/foot/src/local/$sys_id.awk $rootdir/items/foot/src/foot.ini.tmpl | tee ~/.config/foot/foot.ini"
            return $(( $? ))
            ;;
        "lithium")
            log_error "$target is not avaliable on headless machine"
            return 1
            ;;
        *)
            log_error "No default installation method is set"
            return 1
            ;;
    esac
}

# Check if the item is installed, return false if installed
function check() {
    [[ -d ~/.config/foot ]] || return 1
    return 0
}

# Things to do to uninstall the item
function uninstall() {
    run rm -rf $HOME/.config/foot
}
