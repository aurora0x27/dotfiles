--bind-try $HOME/Documents/         $HOME/Documents/
--bind-try $HOME/Desktop/           $HOME/Desktop/
--bind-try $HOME/Pictures/          $HOME/Pictures/
--bind-try $HOME/Videos/            $HOME/Videos/
--bind-try $HOME/Data/              $HOME/Data/
--bind-try $HOME/Workspace/         $HOME/Workspacet/
--bind     $HOME/.local/share/icons $HOME/.local/share/icons
--setenv GTK_USE_PORTAL 1
--setenv GTK_THEME Adwaita:dark
--setenv XCURSOR_THEME MikuComplete
--setenv XCURSOR_SIZE 32
