#!/usr/bin/env bash

# Check the dependency return false if installed dependency
function check_dep() {
    command -v yt-dlp 1>/dev/null 2>&1 && return 0
    return 1
}

# Things to do to install the dependency
function install_dep() {
    if [[ $sys_id == "hydrogen" ]]; then
        run paru -S yt-dlp
    elif [[ $sys_id == "helium" ]]; then
        run brew install yt-dlp
    else
        log_error "No default installation method is set"
        return 1
    fi
}

# Things to do to install the item
function install() {
    run mkdir -p $HOME/.config/yt-dlp
    run ln -sfn $rootdir/items/yt-dlp/src/yt-dlp.conf $HOME/.config/yt-dlp/yt-dlp.conf
}

# Check if the item is installed, return false if installed
function check() {
    [[ -d $HOME/.config/yt-dlp ]] && return 0
    return 1
}

# Things to do to uninstall the item
function uninstall() {
    run rm -rf $HOME/.config/yt-dlp
}
