#!/usr/bin/env bash

execs=("$rootdir/items/scripts/src/bin"/*)

check_dep() {
    return 0
}

install_dep() {
    :;
}

install() {
    for item in "${execs[@]}"; do
        local name
        name=$(basename "$item")
        run ln -sfn "$item" "$HOME/.local/bin/$name"
    done
}

check() {
    for item in "${execs[@]}"; do
        local name
        name=$(basename "$item")
        [[ -f "$HOME/.local/bin/$name" ]] || return 1
    done
    return 0
}

uninstall() {
    for item in "${execs[@]}"; do
        local name
        name=$(basename "$item")
        [[ -f "$HOME/.local/bin/$name" ]] && run rm "$HOME/.local/bin/$name"
    done
}
