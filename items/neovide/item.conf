#!/usr/bin/env bash

declare -A DEPS=(
    # [name]="packname"
    [neovide]="neovide"
)

declare -A HAS

# Check the dependency return true if installed dependency
function check_dep() {
    if [ $(uname) != "Linux" ]; then
        log_error "Cannot install niri on a non-linux system"
        return 1
    fi
    local all_ok=1
    if [[ $sys_id == "archlinux" ]]; then
        for dep in "${!DEPS[@]}"; do
            local pkg="${DEPS[$dep]}"
            if pacman -Q "$pkg" >/dev/null 2>&1; then
                HAS[$dep]=1
            else
                HAS[$dep]=0 
                all_ok=0
                log_hint "'$dep' provided by package '$pkg' not installed"
            fi
        done
        return $(( !$all_ok ))
    else
        return 1
    fi
}

# Things to do to install the dependency
function install_dep() {
    if [[ $sys_id == "archlinux" ]]; then
        for dep in "${!DEPS[@]}"; do
            local pkg="${DEPS[$dep]}"
            [[ ${HAS[$dep]} -eq 0 ]] && run paru -S "$pkg"
        done
    elif [[ $sys_id == "macmini" ]]; then
        for dep in "${!DEPS[@]}"; do
            local pkg="${DEPS[$dep]}"
            [[ ${HAS[$dep]} -eq 0 ]] && run brew -S "$pkg"
        done
    else
        log_error "No default installation method is set"
        return 1
    fi
}

# Things to do to install the item
function install() {
    if [[ $sys_id == "macmini" ]]; then
        run mkdir -p $HOME/.config/neovide
        log_hint "Gnerating config file..."
        run "gawk -f $rootdir/utils/replace.awk $rootdir/items/neovide/src/local/$sys_id.awk $rootdir/items/neovide/src/config.toml.tmpl | tee $HOME/.config/neovide/config.toml "
    elif [[ $sys_id == "archlinux"  ]]; then
        run mkdir -p $HOME/.config/neovide
        log_hint "Gnerating config file..."
        run "awk -f $rootdir/utils/replace.awk $rootdir/items/neovide/src/local/$sys_id.awk $rootdir/items/neovide/src/config.toml.tmpl | tee $HOME/.config/neovide/config.toml "
    else
        log_error "No default installation method is set"
        return 1
    fi
}

# Check if the item is installed, return true if installed
function check() {
    [[ -d ~/.config/neovide ]] && return 0
    return 1
}

# Things to do to uninstall the item
function uninstall() {
    run rm -rf ~/.config/neovide
}
