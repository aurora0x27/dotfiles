#!/usr/bin/env bash

# Check the dependency return true if installed dependency
function check_dep() {
    if [ $(uname) != "Linux" ]; then
        log_error "Cannot install hyprland on a non-linux system"
        return 1
    fi
    return 0
}

# Things to do to install the dependency
function install_dep() {
    if [[ $sys_id == "archlinux" ]]; then
        run paru -S hyprland hyprlock
    else
        log_error "No default installation method is set"
        return 1
    fi
}

# Things to do to install the item
function install() {
    run ln -sf $roodir/items/hyprland/src ~/.config/hypr
}

# Check if the item is installed, return true if installed
function check() {
    [[ -L ~/.config/hypr ]] && return 1
    return 0
}

# Things to do to uninstall the item
function uninstall() {
    run unlink ~/.config/hypr
}
