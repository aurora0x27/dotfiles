#!/usr/bin/env bash

# Check the dependency return true if installed dependency
function check_dep() {
    [[ -d ~/.oh-my-bash ]] && return 0
    return 1
}

# Things to do to install the dependency
function install_dep() {
    # Stop auto run bash
    run 'curl -fsSL https://raw.githubusercontent.com/ohmybash/oh-my-bash/master/tools/install.sh | sed "s/exec\ bash/:;/" | bash -'
    run mv ~/.bashrc ~/.bashrc.default
}

# Things to do to install the item
function install() {
    run ln -sf $rootdir/items/bash/src/bash.conf.sh ~/.bashrc
}

# Check if the item is installed, return true if installed
function check() {
    [[ -L ~/.bashrc ]] && return 0
    return 1
}

# Things to do to uninstall the item
function uninstall() {
    run unlink ~/.bashrc
}
