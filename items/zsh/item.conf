#!/usr/bin/env bash

# How to localize

# Check the dependency return true if installed dependency
function check_dep() {
    [[ -d ~/.local/share/zinit ]] && return 0
    command -v starship
    return 1
}

# Things to do to install the dependency
function install_dep() {
    run 'bash -c "NO_EDIT=1; NO_TUTORIAL=1; $(curl -fsSL https://raw.githubusercontent.com/zdharma-continuum/zinit/HEAD/scripts/install.sh)"'
}

# Things to do to install the item
function install() {
    run ln -sf $rootdir/items/zsh/src/zsh.conf ~/.zshrc
    items=$(bash -c "ls $rootdir/items/zsh/src/modules")
    run mkdir -p ~/.zsh/modules
    for item in $items; do
        run ln -sfn $rootdir/items/zsh/src/modules/$item ~/.zsh/modules/$item
    done
    case "$sys_id" in
        # Localize?
        "hydrogen")
            run "ln -sfn $rootdir/items/zsh/src/local/$sys_id.conf ~/.zsh/localize.conf"
            ;;
        "helium")
            run "ln -sfn $rootdir/items/zsh/src/local/$sys_id.conf ~/.zsh/localize.conf"
            ;;
        "lithium")
            run "ln -sfn $rootdir/items/zsh/src/local/$sys_id.conf ~/.zsh/localize.conf"
            ;;
        *)
            log_warn "Not assigned a system_id, some localized config maynot be installed"
            mkdir -p ~/.zsh
            touch ~/.zsh/localize.conf
            ;;
    esac
}

# Check if the item is installed, return true if installed
function check() {
    [[ -f ~/.zshrc ]] && return 0
    return 1
}

# Things to do to uninstall the item
function uninstall() {
    run unlink ~/.zshrc
    run unlink ~/.zsh/localize.conf
    run rm -rf ~/.zsh/modules
}
