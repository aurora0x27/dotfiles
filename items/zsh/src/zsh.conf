export ZSH="$HOME/.oh-my-zsh"

# Set name of the theme to load --- if set to "random", it will
# load a random theme each time oh-my-zsh is loaded, in which case,
# to know which specific one was loaded, run: echo $RANDOM_THEME
# See https://github.com/ohmyzsh/ohmyzsh/wiki/Themes
ZSH_THEME="kali"

ZSH_CACHE_DIR=$HOME/.cache/oh-my-zsh
if [[ ! -d $ZSH_CACHE_DIR ]]; then
    mkdir $ZSH_CACHE_DIR
fi

plugins=(
    git
    autojump
    colored-man-pages
)

source $ZSH/oh-my-zsh.sh

# export environment vars
export XMAKE_THEME=catppuccin_mocha
export EDITOR=nvim
export GO111MODULE=on
export GOPROXY=https://goproxy.cn

unalias ls
alias ls=lsd
alias lt="ls --tree"
alias zsh-config="nvim ~/.zshrc && source ~/.zshrc"
alias vi=nvim
alias zsh-config="nvim ~/.zshrc && source ~/.zshrc"
alias yz="yazi"
alias lg="lazygit"
alias proxy-on="export ALL_PROXY=\"socks5://127.0.0.1:2080\""
alias proxy-off="unset ALL_PROXY"
alias gdb-config="nvim ~/.gdbinit"

proxy-status() {
    [[ -n ${ALL_PROXY} ]] && echo "ALL_PROXY: $ALL_PROXY" || echo "No proxy is on"
}

touchx() {
    [[ $# -eq 0 ]] && {
        echo "Touch executable files"
        echo ""
        echo "Usage: touchx file1 file2..."
        return 0
    }
    for name in "$@"; do
        mkdir -p $(dirname "$name")
        touch "$name" && chmod +x "$name"
    done
}

filex() {
    [[ $# -eq 0 ]] && {
        echo "filex -- Get file info of executable in \$PATH by name"
        echo ""
        echo "Usage: filex [options] <name1> <name2>"
        echo ""
        echo "Options:"
        echo "    -tldr                 Add a simple manual"
        echo "    -view \"<command>\"     View with command, with full"
        echo "                          path appended to the end of command"
        return 0;
    }
    tldr=0
    view=0
    cmd="xdg-open"
    files=()
    while [[ $# -gt 0 ]]; do
        case "$1" in
            -tldr)
                tldr=1
                shift
                ;;
            -view)
                view=1
                shift
                [[ $# -lt 1 ]] && {
                    echo "Warn: Lost command"
                    break
                }
                [[ $1 == -* ]] && {
                    # An option
                    shift
                    echo "Warn: Lost command, or, did you use a '-*' string as command?"
                    continue
                }
                cmd="$1"
                shift
                ;;
            -*)
                echo "Warn unknown option: '$1'"
                shift
                ;;
            *)
                files+="$1"
                shift
                ;;
        esac
    done

    [[ $view -eq 1 ]] && {
        ("$cmd" -- "${args[@]}" &) &
        return 0
    }

    ret=0
    for item in "${files[@]}"; do
        file $(which -- "$item")
        ret=$(( ret || $? ))
        [[ $tldr -eq 1 ]] && {
            tldr -- "$item"
            ret=$(( ret || $? ))
        }
    done
    return $ret
}

export LG_CONFIG_FILE=$HOME/.config/lazygit/config.yml

#vi mode
bindkey -v

source ~/.zsh/localize.conf

[[ -f $HOME/.zsh/extras.sh ]] && source $HOME/.zsh/extras.sh

if [[ -z $ZSH_FUSE_NATIVE_PROMPT ]]; then
    # Safe load starship
    [[ -z $STARSHIP_LOADED ]] && {
        eval "$(starship init zsh)"
            STARSHIP_LOADED=1
    }
else
    if [[ $- == *i* ]]; then
        # Record last command status
        precmd() {
            LAST_STATUS=$?
        }

        function update_rps1 {
            local color mode status_color

            if (( LAST_STATUS == 0 )); then
                status_color="%B%F{cyan}"
            else
                status_color="%B%F{red}"
            fi

            if [[ $KEYMAP == vicmd ]]; then
                mode="%B%F{blue}-- NORMAL --%f%b"
            else
                mode="${status_color}-- INSERT --%f%b"
            fi

            RPS1="${mode}"
        }

        function zle-keymap-select {
            update_rps1
            zle reset-prompt
        }

        function zle-line-init {
            update_rps1
            zle reset-prompt
        }

        zle -N zle-keymap-select
        zle -N zle-line-init
        zle-line-init 2>/dev/null || true
    fi
fi
