#!/usr/bin/env bash

# Check the dependency return true if installed dependency
function check_dep() {
    if command -v btop >/dev/null 2>&1; then
        return 1
    else
        return 0
    fi
}

# Things to do to install the dependency
function install_dep() {
    if [[ $sys_id == "macmini" ]]; then
        run brew install btop
    elif [[ $sys_id == "archlinux" ]]; then
        run paru -S btop
    else
        log_error "No default installation method is set"
        return 1
    fi
}

# Things to do to install the item
function install() {
    run mkdir -p ~/.config/btop
    run ln -sf $rootdir/items/btop/src/btop.conf ~/.config/btop/btop.conf
}

# Check if the item is installed, return true if installed
function check() {
    if [[ -d ~/.config/btop ]]; then
        return 1
    else
        return 0
    fi
}

# Things to do to uninstall the item
function uninstall() {
    run unlink ~/.config/btop
}
