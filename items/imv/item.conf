#!/usr/bin/env bash

# Check the dependency return true if installed dependency
function check_dep() {
    command -v imv >/dev/null 2>&1 && return 1
    return 0
}

# Things to do to install the dependency
function install_dep() {
    run paru -S imv
}

# Things to do to install the item
function install() {
    run mkdir -p $HOME/.config/imv
    run ln -sfn $rootdir/items/imv/src/config $HOME/.config/imv/config
}

# Check if the item is installed, return true if installed
function check() {
    [[ -d $HOME/.config/imv ]] && return 1
    return 0
}

# Things to do to uninstall the item
function uninstall() {
    run rm -rf $HOME/.config/imv
}
